version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iades-postgres
    environment:
      POSTGRES_DB: iades_db
      POSTGRES_USER: iades_user
      POSTGRES_PASSWORD: iades_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iades_user -d iades_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iades-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
